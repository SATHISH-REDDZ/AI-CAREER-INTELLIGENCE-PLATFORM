{% extends "base.html" %}
{% block title %}User Profile — AI Career Intelligence Platform{% endblock %}

{% block content %}
<div class="d-flex justify-content-center py-4">
    <div style="max-width: 760px; width: 100%;">
        <div class="glass-card p-4 p-md-5">
            <div class="d-flex align-items-center gap-4 mb-4 pb-4 border-bottom border-secondary opacity-75">
                <div style="width: 72px; height: 72px; background: linear-gradient(135deg, #10b981, #3b82f6); border-radius: 20px; flex-shrink: 0;" class="d-flex align-items-center justify-content-center fs-2 text-white fw-bold">
                    AJ
                </div>
                <div>
                    <h3 class="fw-bold text-white mb-1">Alex Johnson</h3>
                    <p class="text-white-50 mb-1">alex.johnson@example.com &bull; <span class="badge badge-pill badge-success">Verified Candidate</span></p>
                    <span class="badge badge-pill badge-primary">Target Role: Python Backend Developer</span>
                </div>
            </div>

            <h5 class="fw-bold text-white mb-3"><i class="fa-solid fa-user-pen text-success me-2"></i> Profile Details</h5>
            <form>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" value="Alex Johnson">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone Number</label>
                        <input type="text" class="form-control" value="+1 (555) 234-5678">
                    </div>
                </div>

                <div class="form-group mb-3">
                    <label class="form-label">Career Bio / Summary</label>
                    <textarea class="form-control" rows="3">Backend Engineer experienced in Python, Flask, PostgreSQL, REST API design, and Docker containerization. Focused on building high-performance cloud applications.</textarea>
                </div>

                <div class="form-group mb-4">
                    <label class="form-label">Current Primary Skills</label>
                    <div>
                        <span class="badge-skill">Python</span>
                        <span class="badge-skill">Flask</span>
                        <span class="badge-skill">SQL</span>
                        <span class="badge-skill">Git</span>
                        <span class="badge-skill">REST API</span>
                        <span class="badge-skill">Docker</span>
                    </div>
                </div>

                <button type="button" class="btn btn-brand" onclick="alert('Profile settings saved successfully!')"><i class="fa-solid fa-floppy-disk me-2"></i> Save Profile</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
