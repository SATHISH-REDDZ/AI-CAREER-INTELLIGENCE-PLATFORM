<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in with Google</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background-color: #202124; color: #e8eaed; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .google-card { background: #303134; border: 1px solid #3c4043; border-radius: 28px; padding: 2.5rem 2rem; width: 100%; max-width: 440px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .google-logo { width: 48px; height: 48px; margin-bottom: 1rem; }
        .card-title { font-size: 1.5rem; font-weight: 400; margin-bottom: 0.5rem; }
        .card-sub { font-size: 0.9rem; color: #bdc1c6; margin-bottom: 2rem; }
        
        .account-item {
            display: flex; align-items: center; gap: 1rem; padding: 0.85rem 1rem; border-radius: 12px; border: 1px solid #3c4043; cursor: pointer; transition: background 0.15s; margin-bottom: 1rem; text-align: left;
        }
        .account-item:hover { background: #3c4043; }
        .account-avatar { width: 40px; height: 40px; border-radius: 50%; background: #a855f7; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; }
        .account-info .name { font-size: 0.95rem; font-weight: 500; color: #e8eaed; }
        .account-info .email { font-size: 0.82rem; color: #9aa0a6; }
        
        .btn-grant { background: #8ab4f8; color: #202124; border: none; padding: 0.75rem 1.5rem; border-radius: 9999px; font-weight: 600; font-size: 0.9rem; cursor: pointer; width: 100%; margin-top: 1rem; }
        .btn-grant:hover { background: #aecbfa; }
        .footer-note { font-size: 0.75rem; color: #9aa0a6; margin-top: 1.5rem; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="google-card">
        <svg class="google-logo" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>

        <h1 class="card-title">Choose an account</h1>
        <p class="card-sub">to continue to <strong>AI Career Intelligence</strong></p>

        <div class="account-item" onclick="grantGoogleAccess()">
            <div class="account-avatar">S</div>
            <div class="account-info">
                <div class="name">Sathish Reddy</div>
                <div class="email">sathishreddzz@gmail.com</div>
            </div>
        </div>

        <button class="btn-grant" onclick="grantGoogleAccess()">Continue as Sathish Reddy</button>

        <div class="footer-note">
            To continue, Google will share your name, email address, and profile picture with AI Career Intelligence.
        </div>
    </div>

    <script>
        function grantGoogleAccess() {
            if (window.opener) {
                window.opener.postMessage({ type: 'GOOGLE_LOGIN_SUCCESS', user: 'Sathish Reddy', email: 'sathishreddzz@gmail.com' }, '*');
            }
            alert("Google access granted for sathishreddzz@gmail.com!");
            window.close();
        }
    </script>
</body>
</html>
